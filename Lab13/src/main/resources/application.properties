spring.application.name=Lab13_crud
# Conexión a MySQL / MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&serverTimezone=America/Monterrey
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
